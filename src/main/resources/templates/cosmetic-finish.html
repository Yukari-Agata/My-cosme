<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" th:href="@{/cosmetic.css}">
</head>
<body>
    <div class="finish-box">
    <h1>♡ 使い終わり ♡</h1>

<form th:action="@{/cosmetics/delete}"
method="post">

<!-- どのコスメかを保持 -->
<input type="hidden"
name="id"
th:value="${cosmeticId}">

<div class="repeat-select">

<label>
<input type="radio"
name="repeatFlag"
value="1"
required>
リピあり
</label>

<label>
<input type="radio"
name="repeatFlag"
value="0">
リピなし
</label>

</div>

<button type="submit">
確定
</button>

</form>

<div class="all-button-area">
<a th:href="@{/cosmetics}">
戻る
</a>
</div>

</div>
</div>
</body>
</html>
